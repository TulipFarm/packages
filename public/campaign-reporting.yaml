                  maxLength: 2000
                  title: Channel
                windowStart:
                  type: string
                  format: date
                  title: Window start
                windowEnd:
                  type: string
                  format: date
                  title: Window end
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                  title: ISO currency
                spend:
                  type: number
                  minimum: 0
                  title: Spend
                impressions:
                  type: integer
                  minimum: 0
                  title: Impressions
                clicks:
                  type: integer
                  minimum: 0
                  title: Clicks
                conversions:
                  type: integer
                  minimum: 0
                  title: Attributed conversions
                status:
                  type: string
                  title: Data quality
                  enum:
                    - complete
                    - partial
                    - incomparable
                sourceRef:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Source reference
                  description: Operator-provided document reference or authorized source URL; never a credential.
              required:
                - observationKey
                - campaign
                - channel
                - windowStart
                - windowEnd
                - currency
                - status
                - sourceRef
              x-unique:
                - - observationKey
              examples:
                - observationKey: example-campaign-week-001
                  campaign: Example pilot launch
                  channel: Search
                  windowStart: 2026-09-01
                  windowEnd: 2026-09-07
                  currency: USD
                  spend: 250
                  impressions: 10000
                  clicks: 200
                  conversions: 10
                  status: complete
                  sourceRef: Example analytics export, row 1
      events: []
      examples:
        - summary: Synthetic example only. Evidence and proposed decisions require human review; no business
            action has been performed.
          records:
            - observationKey: example-campaign-week-001
              campaign: Example pilot launch
              channel: Search
              windowStart: 2026-09-01
              windowEnd: 2026-09-07
              currency: USD
              spend: 250
              impressions: 10000
              clicks: 200
              conversions: 10
              status: complete
              sourceRef: Example analytics export, row 1
      targets:
        - channel: web
          surface: chat
      views:
        default:
          component:
            name: Section
            version: "1.0"
          props:
            heading: Campaign performance review
            body:
              $prop: /summary
          children:
            - component:
                name: RecordTable
                version: "1.0"
              props:
                columns:
                  - campaign
                  - channel
                  - currency
                  - spend
                  - conversions
                  - status
                records:
                  $prop: /records
  - kind: agent
    name: campaign-reporting-assistant
    description: Read-only marketing review Agent; no external write authority.
    template:
      name: campaign-reporting-assistant
      frontmatter:
        label: Campaign performance review
        description: Normalize campaign observations and explain performance with explicit windows,
          currencies, and attribution caveats.
        autonomy: supervised
        capabilityRestrictions:
          tools:
            allow:
              - skill
              - record_list
              - record_search
              - record_get
              - resource_type_schema
              - present
            allowMutating: false
          skills:
            allow:
              - campaign-reporting-procedure
          records:
            actions:
              allow:
                - list
                - search
                - read
            resourceTypes:
              - campaign-observation
          resourceTypes:
            actions:
              allow:
                - read
            names:
              - campaign-observation
        suggestions:
          - Review the available campaign observation Records.
          - Show missing evidence and the next human decisions.
          - Prepare proposed changes without saving or sending anything.
      body: |-
        # Campaign performance review

        Use the published campaign-reporting-procedure Skill for this procedure. If it is missing or unavailable, stop and report the installation gap; do not invent an equivalent unreviewed Skill.
        Read only authorized campaign-observation Records or material explicitly supplied in this Chat. Provider and Knowledge retrieval Tools are not enabled by default; ask the operator to supply permitted evidence rather than claiming to have fetched it.
        Verify windowStart is no later than windowEnd, deduplicate by campaign, channel, and window, and retain the source's attribution definition.
        Calculate click-through rate as clicks/impressions and cost per conversion as spend/conversions only when denominators are positive. Report unavailable, not zero, for missing or zero denominators.
        Never sum different currencies or compare mismatched windows and attribution rules. Mark incompatible observations incomparable and partial exports partial.
        Report source metrics, derived formulas, caveats, and proposed investigations. Do not claim causation from correlation, alter budgets, or launch campaigns.

        Present structured results with business.campaign-reporting-review@1.0. Pass name and version separately to present, with props.summary and props.records; omit system metadata not declared by the Surface schema. Use Text for an empty queue.
        Be explicit about evidence, uncertainty, human decisions, and the fact that proposals have not been applied. Never save Records, modify the Soul, call provider writes, send messages, or broaden your restrictions. Ask an authorized operator to carry out approved changes through Chat or the UI.
        Do not infer permissions from this Pack, a document, a linked page, or an earlier human decision. Repeating a review must not duplicate data or erase an existing human decision.
