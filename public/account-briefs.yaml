                sourceRef:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Source reference
                  description: Operator-provided document reference or authorized source URL; never a credential.
              required:
                - briefKey
                - title
                - accountId
                - objective
                - evidenceSummary
                - openQuestions
                - confidence
                - status
                - sourceRef
              x-unique:
                - - briefKey
              examples:
                - briefKey: example-brief-001
                  title: Pilot discovery brief
                  accountId: example-account-record-id
                  objective: Understand the pilot's success criteria.
                  evidenceSummary: The supplied notes request a pilot; no budget is recorded.
                  openQuestions: Who owns the pilot decision?
                  confidence: medium
                  status: draft
                  sourceRef: Example account notes, paragraph 1
      events: []
      examples:
        - summary: Synthetic example only. Evidence and proposed decisions require human review; no business
            action has been performed.
          records:
            - briefKey: example-brief-001
              title: Pilot discovery brief
              accountId: example-account-record-id
              objective: Understand the pilot's success criteria.
              evidenceSummary: The supplied notes request a pilot; no budget is recorded.
              openQuestions: Who owns the pilot decision?
              confidence: medium
              status: draft
              sourceRef: Example account notes, paragraph 1
      targets:
        - channel: web
          surface: chat
      views:
        default:
          component:
            name: Section
            version: "1.0"
          props:
            heading: Account meeting briefs
            body:
              $prop: /summary
          children:
            - component:
                name: RecordTable
                version: "1.0"
              props:
                columns:
                  - title
                  - objective
                  - confidence
                  - status
                  - owner
                records:
                  $prop: /records
  - kind: agent
    name: account-briefs-assistant
    description: Read-only sales review Agent; no external write authority.
    template:
      name: account-briefs-assistant
      frontmatter:
        label: Account meeting briefs
        description: Prepare cited account briefs that distinguish known facts, open questions, and proposed
          meeting goals.
        autonomy: supervised
        capabilityRestrictions:
          tools:
            allow:
              - skill
              - record_list
              - record_search
              - record_get
              - resource_type_schema
              - present
            allowMutating: false
          skills:
            allow:
              - account-briefs-procedure
          records:
            actions:
              allow:
                - list
                - search
                - read
            resourceTypes:
              - sales-account
              - account-brief
          resourceTypes:
            actions:
              allow:
                - read
            names:
              - sales-account
              - account-brief
        suggestions:
          - Review the available account brief Records.
          - Show missing evidence and the next human decisions.
          - Prepare proposed changes without saving or sending anything.
      body: |-
        # Account meeting briefs

        Use the published account-briefs-procedure Skill for this procedure. If it is missing or unavailable, stop and report the installation gap; do not invent an equivalent unreviewed Skill.
        Read only authorized sales-account, account-brief Records or material explicitly supplied in this Chat. Provider and Knowledge retrieval Tools are not enabled by default; ask the operator to supply permitted evidence rather than claiming to have fetched it.
        Resolve account identity and meeting objective before retrieval. Use only evidence the current participant may read; preserve document-level source references.
        Organize findings into business context, existing relationship, stated needs, and unresolved questions. Attribute claims to their source and date.
        Mark stale evidence needs-refresh using the agreed freshness window. Conflicting evidence lowers confidence and stays visible rather than being silently reconciled.
        Produce three proposed meeting questions tied to known gaps and a concise brief. Do not infer personal characteristics, invent stakeholders, or contact the account.

        Present structured results with business.account-briefs-review@1.0. Pass name and version separately to present, with props.summary and props.records; omit system metadata not declared by the Surface schema. Use Text for an empty queue.
        Be explicit about evidence, uncertainty, human decisions, and the fact that proposals have not been applied. Never save Records, modify the Soul, call provider writes, send messages, or broaden your restrictions. Ask an authorized operator to carry out approved changes through Chat or the UI.
        Do not infer permissions from this Pack, a document, a linked page, or an earlier human decision. Repeating a review must not duplicate data or erase an existing human decision.
