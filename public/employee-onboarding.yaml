                  minLength: 1
                  maxLength: 2000
                  title: Role
                item:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Checklist item
                category:
                  type: string
                  title: Item category
                  enum:
                    - identity
                    - device
                    - training
                    - workspace
                status:
                  type: string
                  title: Status
                  enum:
                    - not-started
                    - waiting-approval
                    - blocked
                    - ready
                blocker:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Blocking dependency
                owner:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Owner
                  description: Named human accountable for the next decision.
                sourceRef:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Source reference
                  description: Operator-provided document reference or authorized source URL; never a credential.
              required:
                - itemKey
                - employee
                - role
                - item
                - category
                - status
                - owner
                - sourceRef
              x-unique:
                - - itemKey
              examples:
                - itemKey: example-hire-001-device
                  employee: Muskan Vijayvargiya
                  role: Support specialist
                  item: Confirm device allocation
                  category: device
                  status: not-started
                  owner: IT owner
                  sourceRef: Example approved onboarding request 001
      events: []
      examples:
        - summary: Synthetic example only. Evidence and proposed decisions require human review; no business
            action has been performed.
          records:
            - itemKey: example-hire-001-device
              employee: Muskan Vijayvargiya
              role: Support specialist
              item: Confirm device allocation
              category: device
              status: not-started
              owner: IT owner
              sourceRef: Example approved onboarding request 001
      targets:
        - channel: web
          surface: chat
      views:
        default:
          component:
            name: Section
            version: "1.0"
          props:
            heading: Employee onboarding readiness
            body:
              $prop: /summary
          children:
            - component:
                name: RecordTable
                version: "1.0"
              props:
                columns:
                  - employee
                  - item
                  - category
                  - status
                  - owner
                records:
                  $prop: /records
  - kind: agent
    name: employee-onboarding-assistant
    description: Read-only it ops review Agent; no external write authority.
    template:
      name: employee-onboarding-assistant
      frontmatter:
        label: Employee onboarding readiness
        description: Track role-based onboarding prerequisites and hand off proposed access requests without
          provisioning accounts.
        autonomy: supervised
        capabilityRestrictions:
          tools:
            allow:
              - skill
              - record_list
              - record_search
              - record_get
              - resource_type_schema
              - present
            allowMutating: false
          skills:
            allow:
              - employee-onboarding-procedure
          records:
            actions:
              allow:
                - list
                - search
                - read
            resourceTypes:
              - onboarding-checklist
          resourceTypes:
            actions:
              allow:
                - read
            names:
              - onboarding-checklist
        suggestions:
          - Review the available onboarding checklist Records.
          - Show missing evidence and the next human decisions.
          - Prepare proposed changes without saving or sending anything.
      body: |-
        # Employee onboarding readiness

        Use the published employee-onboarding-procedure Skill for this procedure. If it is missing or unavailable, stop and report the installation gap; do not invent an equivalent unreviewed Skill.
        Read only authorized onboarding-checklist Records or material explicitly supplied in this Chat. Provider and Knowledge retrieval Tools are not enabled by default; ask the operator to supply permitted evidence rather than claiming to have fetched it.
        Confirm the hiring manager's approved role and start date. Request only the minimum data needed for readiness; do not collect passwords, government identifiers, or health information.
        Compare the approved role checklist with supplied evidence and create proposed item diffs keyed by employee request plus checklist item; reuse existing items on retries.
        Keep identity activation blocked until the responsible human approves the exact access. A request submitted or an email sent is not evidence that access or a device is ready.
        Present readiness by category, blockers, owners, and next decisions. Escalate missing approvals to the operator; do not provision, purchase, invite, or alter Team membership.

        Present structured results with business.employee-onboarding-review@1.0. Pass name and version separately to present, with props.summary and props.records; omit system metadata not declared by the Surface schema. Use Text for an empty queue.
        Be explicit about evidence, uncertainty, human decisions, and the fact that proposals have not been applied. Never save Records, modify the Soul, call provider writes, send messages, or broaden your restrictions. Ask an authorized operator to carry out approved changes through Chat or the UI.
        Do not infer permissions from this Pack, a document, a linked page, or an earlier human decision. Repeating a review must not duplicate data or erase an existing human decision.
