                  minLength: 1
                  maxLength: 2000
                  title: Draft follow-up
                sourceRef:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Source reference
                  description: Operator-provided document reference or authorized source URL; never a credential.
              required:
                - dealKey
                - title
                - accountId
                - stage
                - nextStep
                - state
                - sourceRef
              x-unique:
                - - dealKey
              examples:
                - dealKey: example-deal-001
                  title: Pilot evaluation
                  accountId: example-account-record-id
                  stage: evaluation
                  nextStep: Confirm evaluation criteria with the account owner.
                  state: waiting
                  owner: Muskan Vijayvargiya
                  sourceRef: Example meeting notes, section 2
      events: []
      examples:
        - summary: Synthetic example only. Evidence and proposed decisions require human review; no business
            action has been performed.
          records:
            - dealKey: example-deal-001
              title: Pilot evaluation
              accountId: example-account-record-id
              stage: evaluation
              nextStep: Confirm evaluation criteria with the account owner.
              state: waiting
              owner: Muskan Vijayvargiya
              sourceRef: Example meeting notes, section 2
      targets:
        - channel: web
          surface: chat
      views:
        default:
          component:
            name: Section
            version: "1.0"
          props:
            heading: Deal follow-up desk
            body:
              $prop: /summary
          children:
            - component:
                name: RecordTable
                version: "1.0"
              props:
                columns:
                  - title
                  - stage
                  - nextStep
                  - state
                  - owner
                records:
                  $prop: /records
  - kind: agent
    name: deal-follow-up-assistant
    description: Read-only sales review Agent; no external write authority.
    template:
      name: deal-follow-up-assistant
      frontmatter:
        label: Deal follow-up desk
        description: Keep commitments, next steps, and draft follow-ups together without sending messages or
          advancing deals automatically.
        autonomy: supervised
        capabilityRestrictions:
          tools:
            allow:
              - skill
              - record_list
              - record_search
              - record_get
              - resource_type_schema
              - present
            allowMutating: false
          skills:
            allow:
              - deal-follow-up-procedure
          records:
            actions:
              allow:
                - list
                - search
                - read
            resourceTypes:
              - sales-account
              - deal-follow-up
          resourceTypes:
            actions:
              allow:
                - read
            names:
              - sales-account
              - deal-follow-up
        suggestions:
          - Review the available deal follow-up Records.
          - Show missing evidence and the next human decisions.
          - Prepare proposed changes without saving or sending anything.
      body: |-
        # Deal follow-up desk

        Use the published deal-follow-up-procedure Skill for this procedure. If it is missing or unavailable, stop and report the installation gap; do not invent an equivalent unreviewed Skill.
        Read only authorized sales-account, deal-follow-up Records or material explicitly supplied in this Chat. Provider and Knowledge retrieval Tools are not enabled by default; ask the operator to supply permitted evidence rather than claiming to have fetched it.
        Resolve the linked Account Record first. Reconcile by dealKey and preserve existing owner-entered commitments rather than replacing them with guesses.
        Extract who promised what and any explicit date from the authorized meeting notes. Resolve relative dates using the operator's timezone; ask when the source is ambiguous.
        Exclude won and lost deals from open follow-up suggestions. Mark blocked when a dependency is unresolved and due only when the agreed due date has passed.
        Draft a concise recap with one next-step question. Present the recipient, source commitment, draft, and proposed Record diff for human review; never send, change stage, or invent a commitment.

        Present structured results with business.deal-follow-up-review@1.0. Pass name and version separately to present, with props.summary and props.records; omit system metadata not declared by the Surface schema. Use Text for an empty queue.
        Be explicit about evidence, uncertainty, human decisions, and the fact that proposals have not been applied. Never save Records, modify the Soul, call provider writes, send messages, or broaden your restrictions. Ask an authorized operator to carry out approved changes through Chat or the UI.
        Do not infer permissions from this Pack, a document, a linked page, or an earlier human decision. Repeating a review must not duplicate data or erase an existing human decision.
