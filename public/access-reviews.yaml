                  title: Account subject
                system:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: System
                entitlement:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Entitlement
                lastUsedDate:
                  type: string
                  format: date
                  title: Last observed use
                recommendation:
                  type: string
                  title: Recommendation
                  enum:
                    - retain
                    - revoke
                    - investigate
                decision:
                  type: string
                  title: Human decision
                  enum:
                    - pending
                    - retain
                    - revoke
                    - exception
                evidence:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Evidence
                reviewer:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Owner
                  description: Named human accountable for the next decision.
                sourceRef:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Source reference
                  description: Operator-provided document reference or authorized source URL; never a credential.
              required:
                - reviewKey
                - campaign
                - subject
                - system
                - entitlement
                - recommendation
                - decision
                - evidence
                - sourceRef
              x-unique:
                - - reviewKey
              examples:
                - reviewKey: example-q3-001
                  campaign: Example quarterly review
                  subject: Muskan Vijayvargiya
                  system: Example help desk
                  entitlement: Ticket reader
                  recommendation: investigate
                  decision: pending
                  evidence: Role owner confirmation is missing.
                  sourceRef: Example entitlement export row 1
      events: []
      examples:
        - summary: Synthetic example only. Evidence and proposed decisions require human review; no business
            action has been performed.
          records:
            - reviewKey: example-q3-001
              campaign: Example quarterly review
              subject: Muskan Vijayvargiya
              system: Example help desk
              entitlement: Ticket reader
              recommendation: investigate
              decision: pending
              evidence: Role owner confirmation is missing.
              sourceRef: Example entitlement export row 1
      targets:
        - channel: web
          surface: chat
      views:
        default:
          component:
            name: Section
            version: "1.0"
          props:
            heading: Access review evidence desk
            body:
              $prop: /summary
          children:
            - component:
                name: RecordTable
                version: "1.0"
              props:
                columns:
                  - subject
                  - system
                  - entitlement
                  - recommendation
                  - decision
                records:
                  $prop: /records
  - kind: agent
    name: access-reviews-assistant
    description: Read-only it ops review Agent; no external write authority.
    template:
      name: access-reviews-assistant
      frontmatter:
        label: Access review evidence desk
        description: Reconcile entitlement evidence and prepare retain-or-revoke recommendations for a human
          reviewer.
        autonomy: supervised
        capabilityRestrictions:
          tools:
            allow:
              - skill
              - record_list
              - record_search
              - record_get
              - resource_type_schema
              - present
            allowMutating: false
          skills:
            allow:
              - access-reviews-procedure
          records:
            actions:
              allow:
                - list
                - search
                - read
            resourceTypes:
              - access-review
          resourceTypes:
            actions:
              allow:
                - read
            names:
              - access-review
        suggestions:
          - Review the available access review Records.
          - Show missing evidence and the next human decisions.
          - Prepare proposed changes without saving or sending anything.
      body: |-
        # Access review evidence desk

        Use the published access-reviews-procedure Skill for this procedure. If it is missing or unavailable, stop and report the installation gap; do not invent an equivalent unreviewed Skill.
        Read only authorized access-review Records or material explicitly supplied in this Chat. Provider and Knowledge retrieval Tools are not enabled by default; ask the operator to supply permitted evidence rather than claiming to have fetched it.
        Verify export scope, timestamp, system owner, and campaign boundaries. Missing last-use evidence is unknown, not proof of inactivity.
        Compare each entitlement against the approved role matrix and explicit exceptions. Highlight orphaned accounts, privilege mismatches, and expired exceptions with evidence.
        Recommend investigate whenever identity matching or entitlement purpose is uncertain. Record reviewer decisions separately from recommendations and never overwrite them.
        Summarize proposed retain/revoke decisions and unresolved evidence. Only a human reviewer may decide; even a revoke decision does not authorize this Agent to change access.

        Present structured results with business.access-reviews-review@1.0. Pass name and version separately to present, with props.summary and props.records; omit system metadata not declared by the Surface schema. Use Text for an empty queue.
        Be explicit about evidence, uncertainty, human decisions, and the fact that proposals have not been applied. Never save Records, modify the Soul, call provider writes, send messages, or broaden your restrictions. Ask an authorized operator to carry out approved changes through Chat or the UI.
        Do not infer permissions from this Pack, a document, a linked page, or an earlier human decision. Repeating a review must not duplicate data or erase an existing human decision.
