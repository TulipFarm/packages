                    - matched
                    - human-approved
                exceptions:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Exceptions
                reviewer:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Owner
                  description: Named human accountable for the next decision.
                sourceRef:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  title: Source reference
                  description: Operator-provided document reference or authorized source URL; never a credential.
              required:
                - invoiceKey
                - invoiceNumber
                - supplier
                - currency
                - total
                - status
                - sourceRef
              x-unique:
                - - invoiceKey
                - - supplier
                  - invoiceNumber
              examples:
                - invoiceKey: example-invoice-001
                  invoiceNumber: INV-EXAMPLE-001
                  supplier: Example Supplier
                  currency: USD
                  subtotal: 100
                  tax: 10
                  total: 110
                  status: needs-evidence
                  exceptions: Approved purchase reference was not supplied.
                  sourceRef: Example invoice, page 1
      events: []
      examples:
        - summary: Synthetic example only. Evidence and proposed decisions require human review; no business
            action has been performed.
          records:
            - invoiceKey: example-invoice-001
              invoiceNumber: INV-EXAMPLE-001
              supplier: Example Supplier
              currency: USD
              subtotal: 100
              tax: 10
              total: 110
              status: needs-evidence
              exceptions: Approved purchase reference was not supplied.
              sourceRef: Example invoice, page 1
      targets:
        - channel: web
          surface: chat
      views:
        default:
          component:
            name: Section
            version: "1.0"
          props:
            heading: Invoice exception review
            body:
              $prop: /summary
          children:
            - component:
                name: RecordTable
                version: "1.0"
              props:
                columns:
                  - invoiceNumber
                  - supplier
                  - currency
                  - total
                  - status
                records:
                  $prop: /records
  - kind: agent
    name: invoice-review-assistant
    description: Read-only document ops review Agent; no external write authority.
    template:
      name: invoice-review-assistant
      frontmatter:
        label: Invoice exception review
        description: Compare invoice evidence with approved purchase records and route mismatches for human
          review, never payment.
        autonomy: supervised
        capabilityRestrictions:
          tools:
            allow:
              - skill
              - record_list
              - record_search
              - record_get
              - resource_type_schema
              - present
            allowMutating: false
          skills:
            allow:
              - invoice-review-procedure
          records:
            actions:
              allow:
                - list
                - search
                - read
            resourceTypes:
              - invoice-review
          resourceTypes:
            actions:
              allow:
                - read
            names:
              - invoice-review
        suggestions:
          - Review the available invoice review Records.
          - Show missing evidence and the next human decisions.
          - Prepare proposed changes without saving or sending anything.
      body: |-
        # Invoice exception review

        Use the published invoice-review-procedure Skill for this procedure. If it is missing or unavailable, stop and report the installation gap; do not invent an equivalent unreviewed Skill.
        Read only authorized invoice-review Records or material explicitly supplied in this Chat. Provider and Knowledge retrieval Tools are not enabled by default; ask the operator to supply permitted evidence rather than claiming to have fetched it.
        Reconcile source invoice identity and supplier plus invoice number before proposing a new Record. Similar totals alone are not proof of duplication.
        Check subtotal plus tax against total under the approved currency precision. Compare quantities, prices, supplier identity, and currency to authorized purchase and receipt evidence.
        Use needs-evidence when purchase or receipt evidence is missing; use exception for a demonstrated mismatch. Matched only means the checked evidence agrees, not that payment is approved.
        Surface exact discrepancies and citations for finance. Treat changed bank instructions as a reason for independent verification; never collect bank credentials, update payment details, approve payment, or transfer funds.

        Present structured results with business.invoice-review-review@1.0. Pass name and version separately to present, with props.summary and props.records; omit system metadata not declared by the Surface schema. Use Text for an empty queue.
        Be explicit about evidence, uncertainty, human decisions, and the fact that proposals have not been applied. Never save Records, modify the Soul, call provider writes, send messages, or broaden your restrictions. Ask an authorized operator to carry out approved changes through Chat or the UI.
        Do not infer permissions from this Pack, a document, a linked page, or an earlier human decision. Repeating a review must not duplicate data or erase an existing human decision.
